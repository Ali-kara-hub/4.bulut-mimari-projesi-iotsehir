<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Şehir Canlı Veri Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #ecf0f1; padding: 20px; border-radius: 6px; text-align: center; border-left: 5px solid #3498db; }
        .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        .meta { margin-top: 20px; text-align: center; font-size: 12px; color: #95a5a6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏙️ Akıllı Şehir Canlı Veri Takip Paneli</h1>
        
        <div class="grid">
            <div class="card">
                <h3>Cihaz Durumu</h3>
                <p id="devId">-</p>
            </div>
            <div class="card" style="border-left-color: #e74c3c;">
                <h3>Sıcaklık</h3>
                <p id="temp">-</p>
            </div>
            <div class="card" style="border-left-color: #2ecc71;">
                <h3>Hava Kalitesi (PM2.5)</h3>
                <p id="aqi">-</p>
            </div>
            <div class="card" style="border-left-color: #f1c40f;">
                <h3>Boş Otopark</h3>
                <p id="parking">-</p>
            </div>
        </div>

        <div class="meta">
            Son Güncelleme Zaman Damgası: <span id="time">-</span>
        </div>
    </div>

    <script>
        // Backend sunucusuna websocket bağlantısı kuruyoruz
        const socket = io();

        // Sunucudan 'anlik-iot-verisi' başlığıyla gelen her datada arayüzü güncelle
        socket.on('anlik-iot-verisi', (data) => {
            document.getElementById('devId').innerText = data.deviceId;
            document.getElementById('temp').innerText = data.sicaklik + " °C";
            document.getElementById('aqi').innerText = data.hava_kalitesi_pm25 + " µg/m³";
            document.getElementById('parking').innerText = data.bos_otopark_sayisi + " Adet";
            document.getElementById('time').innerText = data.timestamp;
        });
    </script>
</body>
</html>
